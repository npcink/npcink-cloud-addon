name: PR Body Contract

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-body-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-body-contract:
    name: PR body contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require AI change envelope sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          # Dependabot bumps carry no maintainer scope/boundary/risk envelope.
          # Gate on actor AND branch prefix so a manually created branch named
          # dependabot/* cannot skip validation. The job must still report
          # success so the required check never goes missing.
          case "$PR_HEAD_REF" in
            dependabot/*)
              if [ "$PR_ACTOR" = "dependabot[bot]" ]; then
                echo "dependabot branch: body contract exempt"
                exit 0
              fi
              ;;
          esac
          printf '%s' "$PR_BODY" | php scripts/validate-pr-body.php -
