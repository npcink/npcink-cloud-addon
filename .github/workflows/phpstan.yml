# PHPStan advisory gate for first-party connector code (level 5 + baseline).
#
# Enrollment follows the OpenCodeReview convention in ocr-review.yml: this
# workflow posts results on PRs but must never join required checks. Treat
# findings as a second opinion: fix real defects or record why they are
# acceptable, and shrink phpstan-baseline.neon over time instead of growing it.
name: PHPStan (advisory)

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cloud-addon-phpstan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan level 5 (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory only: a red run must not block merge. Remove together with the
    # baseline once the level-5 debt is paid down.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer run stan
