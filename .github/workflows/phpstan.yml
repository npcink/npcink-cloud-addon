# PHPStan gate for first-party connector code (level 5 + baseline).
#
# A red run now fails the workflow. Fix real defects or record why they are
# acceptable, and shrink phpstan-baseline.neon over time instead of growing it.
# When a baseline entry stops matching, regenerate it with
# `vendor/bin/phpstan analyse --generate-baseline phpstan-baseline.neon`.
name: PHPStan

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cloud-addon-phpstan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan level 5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer run stan
