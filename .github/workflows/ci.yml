name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # 19:37 UTC daily (03:37 Beijing time): nightly master-HEAD matrix run for
    # compatibility stability evidence; off the hour to avoid peak load.
    - cron: '37 19 * * *'

permissions:
  contents: read

concurrency:
  group: cloud-addon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-contracts:
    name: PHP ${{ matrix.php }} contracts
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: PHP lint
        run: composer run lint:php

      - name: Contract tests
        run: composer run test:contracts

      - name: Run WordPress.org review guard
        run: composer run check:wporg

      - name: Boundary search
        run: composer run check:boundary

  php-contracts-required:
    name: PHP contracts
    needs: php-contracts
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every PHP contract matrix job
        env:
          MATRIX_RESULT: ${{ needs.php-contracts.result }}
        run: test "$MATRIX_RESULT" = success

  wordpress-ai-compatibility:
    name: WordPress AI ${{ matrix.lane }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.gate == 'non_blocking_warning' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable-primary
            wordpress: '7.0.4'
            ai_version: '1.3.0'
            php: '8.0'
            gate: blocking
          - lane: stable-primary
            wordpress: '7.0.4'
            ai_version: '1.3.0'
            php: '8.2'
            gate: blocking
          - lane: stable-primary
            wordpress: '7.0.4'
            ai_version: '1.3.0'
            php: '8.4'
            gate: blocking
          - lane: stable-regression
            wordpress: '7.1.1'
            ai_version: '1.2.0'
            php: '8.2'
            gate: blocking
          - lane: upstream-warning
            wordpress: '7.1.1'
            ai_version: develop
            php: '8.2'
            gate: non_blocking_warning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run compatibility lane
        env:
          WP_AI_COMPAT_LANE: ${{ matrix.lane }}
          NPCINK_COMPAT_PLAYGROUND_PORT: 9427
          NPCINK_COMPAT_WORDPRESS_VERSION: ${{ matrix.wordpress }}
          NPCINK_COMPAT_PHP_VERSION: ${{ matrix.php }}
          NPCINK_COMPAT_AI_VERSION: ${{ matrix.ai_version }}
        run: composer run smoke:wp-ai-compatibility -- "$WP_AI_COMPAT_LANE"

  wordpress-ai-compatibility-required:
    name: WordPress AI compatibility blocking lanes
    needs: wordpress-ai-compatibility
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require blocking compatibility lanes
        env:
          MATRIX_RESULT: ${{ needs.wordpress-ai-compatibility.result }}
        run: test "$MATRIX_RESULT" = success

  release-static:
    name: Release static gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2, wp-cli

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: JavaScript syntax
        run: composer run check:js

      - name: POT freshness
        run: WP_CLI_BIN="$(command -v wp)" composer run i18n:check

      - name: Build and verify final ZIP
        run: composer run package:release && composer run package:verify

      - name: Playground activation smoke
        run: composer run smoke:playground
