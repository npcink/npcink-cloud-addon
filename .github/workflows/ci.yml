name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: cloud-addon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-contracts:
    name: PHP ${{ matrix.php }} contracts
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: PHP lint
        run: composer run lint:php

      - name: Contract tests
        run: composer run test:contracts

      - name: Run WordPress.org review guard
        run: composer run check:wporg

      - name: Boundary search
        run: composer run check:boundary

  php-contracts-required:
    name: PHP contracts
    needs: php-contracts
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every PHP contract matrix job
        env:
          MATRIX_RESULT: ${{ needs.php-contracts.result }}
        run: test "$MATRIX_RESULT" = success

  release-static:
    name: Release static gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2, wp-cli

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: JavaScript syntax
        run: composer run check:js

      - name: POT freshness
        run: WP_CLI_BIN="$(command -v wp)" composer run i18n:check

      - name: Build and verify final ZIP
        run: composer run package:release && composer run package:verify

      - name: Playground activation smoke
        run: composer run smoke:playground
